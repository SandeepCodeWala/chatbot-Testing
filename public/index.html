<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocus AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --vocus-blue:   #1400CC;
      --vocus-dark:   #0A0082;
      --vocus-cyan:   #00E5C8;
      --vocus-cyan2:  #00C4AC;
      --vocus-light:  #F0F4FF;
      --vocus-border: #E2E8F8;
      --vocus-muted:  #6B7BB0;
      --vocus-text:   #0D1340;
      --vocus-sub:    #8892B8;
      --white:        #ffffff;
      --radius:       12px;
      --radius-sm:    8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #EEF2FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* subtle dotted bg pattern matching Vocus logo */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, #1400CC18 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .shell {
      position: relative; z-index: 1;
      width: 100%; max-width: 800px; height: 95vh;
      background: var(--white);
      border-radius: 20px;
      border: 1px solid var(--vocus-border);
      box-shadow: 0 8px 40px rgba(20,0,204,0.10), 0 2px 8px rgba(20,0,204,0.06);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: var(--vocus-blue);
      padding: 0 20px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    /* Vocus logo recreation */
    .vocus-logo {
      display: flex; align-items: center; gap: 0;
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 22px; color: var(--white);
      letter-spacing: -0.5px;
    }
    .logo-v { color: var(--white); }
    .logo-o {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
    }
    .logo-o svg { position: absolute; }
    .logo-rest { color: var(--white); }

    .brand-tag {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      letter-spacing: 0.8px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    /* provider toggle */
    .toggle {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px; padding: 3px; gap: 2px;
    }
    .tog {
      border: none; cursor: pointer;
      padding: 5px 14px; border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s; color: rgba(255,255,255,0.65);
      background: transparent;
    }
    .tog.active {
      background: var(--vocus-cyan);
      color: var(--vocus-dark);
    }

    .hdr-btn {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: background 0.2s;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.22); }

    /* ── Module tabs ── */
    .mod-bar {
      padding: 0 16px;
      border-bottom: 1px solid var(--vocus-border);
      display: flex; gap: 0; overflow-x: auto;
      flex-shrink: 0;
      background: var(--white);
    }
    .mod-bar::-webkit-scrollbar { display: none; }

    .mod-tab {
      padding: 10px 14px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--vocus-sub);
      cursor: pointer; white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.18s;
      background: none; border-top: none; border-left: none; border-right: none;
      font-family: 'Inter', sans-serif;
    }
    .mod-tab:hover { color: var(--vocus-blue); }
    .mod-tab.active {
      color: var(--vocus-blue);
      border-bottom-color: var(--vocus-cyan);
      font-weight: 700;
    }

    /* ── Messages ── */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 18px; display: flex; flex-direction: column; gap: 14px;
      background: var(--vocus-light);
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--vocus-border); border-radius: 4px; }

    .msg { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.25s ease; }
    .msg.user { flex-direction: row-reverse; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .av {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .msg.bot  .av { background: var(--vocus-blue); color: var(--white); }
    .msg.user .av { background: var(--vocus-cyan); color: var(--vocus-dark); }

    .msg-body { display: flex; flex-direction: column; max-width: 72%; }
    .msg.user .msg-body { align-items: flex-end; }

    .provider-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
      padding: 2px 7px; border-radius: 20px; margin-bottom: 4px;
    }
    .chip-groq   { background: #E6FBF7; color: #007A68; border: 1px solid #9FDED7; }
    .chip-claude { background: #EEF0FF; color: #3730A3; border: 1px solid #C7CAF5; }
    .chip-openai { background: #FFF8EE; color: #B45309; border: 1px solid #FCD49A; }

    .bubble {
      padding: 11px 14px; border-radius: 14px;
      font-size: 13.5px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.bot .bubble {
      background: var(--white);
      border: 1px solid var(--vocus-border);
      color: var(--vocus-text);
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: var(--vocus-blue);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px; color: var(--vocus-sub);
      margin-top: 4px; padding: 0 2px;
    }

    /* typing */
    .typing-dots { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      animation: dotBounce 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(1) { background: var(--vocus-blue); }
    .typing-dots span:nth-child(2) { background: var(--vocus-blue); animation-delay: 0.2s; opacity: 0.7; }
    .typing-dots span:nth-child(3) { background: var(--vocus-cyan2); animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,80%,100% { transform: translateY(0) scale(1); }
      40%          { transform: translateY(-5px) scale(1.1); }
    }

    /* sys note */
    .sys-note {
      text-align: center; font-size: 10px; color: var(--vocus-sub);
      letter-spacing: 0.4px; padding: 2px 0;
      display: flex; align-items: center; gap: 8px;
    }
    .sys-note::before, .sys-note::after {
      content: ''; flex: 1; height: 1px; background: var(--vocus-border);
    }

    /* ── Quick actions ── */
    .quick-bar {
      padding: 8px 16px 6px;
      display: flex; gap: 6px; flex-wrap: wrap;
      border-top: 1px solid var(--vocus-border);
      background: var(--white);
      flex-shrink: 0;
    }
    .q-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 500;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--vocus-border);
      color: var(--vocus-muted);
      background: var(--white);
      cursor: pointer; transition: all 0.18s;
    }
    .q-btn:hover {
      background: var(--vocus-light);
      border-color: var(--vocus-blue);
      color: var(--vocus-blue);
    }

    /* ── Input ── */
    .input-row {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--vocus-border);
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--white);
      flex-shrink: 0;
    }
    textarea {
      flex: 1; resize: none;
      background: var(--vocus-light);
      border: 1.5px solid var(--vocus-border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: 'Inter', sans-serif; font-size: 14px;
      color: var(--vocus-text); outline: none;
      min-height: 44px; max-height: 110px; overflow-y: auto;
      line-height: 1.5; transition: border-color 0.2s, background 0.2s;
    }
    textarea:focus {
      border-color: var(--vocus-blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(20,0,204,0.07);
    }
    textarea::placeholder { color: var(--vocus-sub); }

    .send-btn {
      width: 44px; height: 44px; border-radius: var(--radius); flex-shrink: 0;
      background: var(--vocus-cyan);
      border: none; cursor: pointer;
      color: var(--vocus-dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,229,200,0.35);
    }
    .send-btn:hover   { background: var(--vocus-cyan2); box-shadow: 0 4px 14px rgba(0,229,200,0.45); transform: translateY(-1px); }
    .send-btn:active  { transform: scale(0.96) translateY(0); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    /* toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #FEF2F2; border: 1px solid #FCA5A5;
      color: #B91C1C; font-size: 12px; font-family: 'Inter', sans-serif;
      padding: 9px 18px; border-radius: var(--radius-sm);
      display: none; z-index: 999; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(185,28,28,0.12);
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <!-- Vocus logo: V + dotted-O + CUS -->
      <div class="vocus-logo">
        <span class="logo-v">V</span>
        <span class="logo-o">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="11" cy="11" r="8" stroke="white" stroke-width="2.2" fill="none"/>
            <circle cx="11" cy="3.5" r="1.4" fill="#00E5C8"/>
            <circle cx="18.5" cy="11" r="1.4" fill="#00E5C8"/>
            <circle cx="11" cy="18.5" r="1.4" fill="#00E5C8"/>
            <circle cx="3.5" cy="11" r="1.4" fill="#00E5C8"/>
            <circle cx="16.5" cy="5.5" r="1.1" fill="white" opacity="0.5"/>
            <circle cx="16.5" cy="16.5" r="1.1" fill="white" opacity="0.5"/>
            <circle cx="5.5" cy="16.5" r="1.1" fill="white" opacity="0.5"/>
            <circle cx="5.5" cy="5.5" r="1.1" fill="white" opacity="0.5"/>
          </svg>
        </span>
        <span class="logo-rest">CUS</span>
      </div>
      <span class="brand-tag">AI ASSISTANT</span>
    </div>
    <div class="header-right">
      <div class="toggle">
        <button class="tog active" id="btn-groq"   onclick="setProvider('groq')">⚡ Groq</button>
        <button class="tog"        id="btn-openai" onclick="setProvider('openai')">◈ OpenAI</button>
        <button class="tog"        id="btn-claude" onclick="setProvider('claude')">✦ Claude</button>
      </div>
      <button class="hdr-btn" onclick="clearChat()" title="Clear chat">↺</button>
    </div>
  </div>

  <!-- Module tabs -->
  <!-- <div class="mod-bar">
    <button class="mod-tab active" onclick="switchMod('all',this)">ALL</button>
    <button class="mod-tab" onclick="switchMod('plans',this)">PLANS</button>
    <button class="mod-tab" onclick="switchMod('contacts',this)">CONTACTS</button>
    <button class="mod-tab" onclick="switchMod('address',this)">ADDRESSES</button>
    <button class="mod-tab" onclick="switchMod('orders',this)">ORDERS</button>
    <button class="mod-tab" onclick="switchMod('requests',this)">REQUESTS</button>
    <button class="mod-tab" onclick="switchMod('users',this)">MOB USERS</button>
    <button class="mod-tab" onclick="switchMod('services',this)">SERVICES</button>
    <button class="mod-tab" onclick="switchMod('sim',this)">SIM</button>
  </div> -->

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="av">V</div>
      <div class="msg-body">
        <span class="provider-chip chip-groq" id="welcomeChip">● Your Assistant</span>
        <div class="bubble">G'day! I'm your <strong>Vocus AI Assistant</strong>.<br><br>I can help you with:<br>› Plans &amp; Cart &nbsp;›&nbsp; Contacts &nbsp;›&nbsp; Delivery Addresses<br>› Orders &amp; Tracking &nbsp;›&nbsp; Requests<br>› Mobile Users &nbsp;›&nbsp; Services &nbsp;›&nbsp; SIM Activation<br><br>Select a module above or just ask me anything.</div>
        <div class="msg-time">Just now</div>
      </div>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="quick-bar" id="quickBar"></div>

  <!-- Input -->
  <div class="input-row">
    <textarea id="input"
      placeholder="Ask Vocus AI anything..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)">
    </textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  let chatHistory    = [];
  let isLoading      = false;
  let activeProvider = 'groq';
  let activeMod      = 'all';

  const modQuicks = {
    all:      ['Show all contacts','Show delivery addresses','View all orders','Fetch plans','List mobile users','Show services'],
    plans:    ['Show all plans','Add a plan to cart','View cart contents'],
    contacts: ['Show all contacts','Add a new contact','Update a contact'],
    address:  ['Show delivery addresses','Add new address','Update an address'],
    orders:   ['Show all orders','Show pending orders','Track an order by ID'],
    requests: ['Show all requests','Show in-progress requests','Get request details'],
    users:    ['List all mobile users','Get user by ID','Create a mobile user','Delete a user'],
    services: ['Show services list','Get actions for a mobile number','Submit a service action'],
    sim:      ['List new SIMs','List port-in SIMs','Activate a new SIM','Port-in activation'],
  };

  function renderQuick() {
    const bar = document.getElementById('quickBar');
    bar.innerHTML = '';
    (modQuicks[activeMod] || []).forEach(label => {
      const b = document.createElement('button');
      b.className = 'q-btn';
      b.textContent = label;
      b.onclick = () => quickSend(label);
      bar.appendChild(b);
    });
  }

  function switchMod(mod, el) {
    activeMod = mod;
    document.querySelectorAll('.mod-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderQuick();
  }

  function setProvider(p) {
    activeProvider = p;
    document.getElementById('btn-groq').classList.toggle('active',   p === 'groq');
    document.getElementById('btn-openai').classList.toggle('active', p === 'openai');
    document.getElementById('btn-claude').classList.toggle('active', p === 'claude');
    const chip = document.getElementById('welcomeChip');
    if (chip) {
      chip.textContent = '● ' + p.toUpperCase();
      chip.className = `provider-chip chip-${p}`;
    }
    chatHistory = [];
    appendSysNote(`Switched to ${p === 'claude' ? '✦ Claude' : '⚡ Groq'} · History cleared`);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function quickSend(text) {
    document.getElementById('input').value = text;
    sendMessage();
  }

  function scrollBottom() {
    const el = document.getElementById('messages');
    requestAnimationFrame(() => el.scrollTop = el.scrollHeight);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
  }

  function timeNow() {
    return new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearChat() {
    chatHistory = [];
    document.getElementById('messages').innerHTML = `
      <div class="msg bot">
        <div class="av">V</div>
        <div class="msg-body">
          <span class="provider-chip chip-${activeProvider}" id="welcomeChip">● ${activeProvider.toUpperCase()}</span>
          <div class="bubble">Session cleared. How can I help you?</div>
          <div class="msg-time">${timeNow()}</div>
        </div>
      </div>`;
  }

  function appendSysNote(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'sys-note';
    el.textContent = text;
    msgs.appendChild(el);
    scrollBottom();
  }

  function appendMessage(role, text, provider) {
    const msgs = document.getElementById('messages');
    const wrapper = document.createElement('div');
    wrapper.className = `msg ${role}`;

    if (role === 'bot') {
      wrapper.innerHTML = `
        <div class="av">V</div>
        <div class="msg-body">
          <span class="provider-chip chip-${provider || activeProvider}">● ${("Your Assistant" || provider || activeProvider).toUpperCase()}</span>
          <div class="bubble">${esc(text).replace(/\n/g,'<br>')}</div>
          <div class="msg-time">${timeNow()}</div>
        </div>`;
    } else {
      wrapper.innerHTML = `
        <div class="msg-body">
          <div class="bubble">${esc(text)}</div>
          <div class="msg-time">${timeNow()}</div>
        </div>
        <div class="av">U</div>`;
    }

    msgs.appendChild(wrapper);
    scrollBottom();
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const w = document.createElement('div');
    w.className = 'msg bot'; w.id = 'typing-indicator';
    w.innerHTML = `
      <div class="av">V</div>
      <div class="msg-body">
        <div class="bubble typing-dots"><span></span><span></span><span></span></div>
      </div>`;
    msgs.appendChild(w);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text  = input.value.trim();
    if (!text || isLoading) return;

    appendMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: chatHistory, provider: activeProvider, module: activeMod })
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        showToast(data.error || 'Request failed');
        appendMessage('bot', '⚠ ' + (data.error || 'Something went wrong. Please try again.'));
      } else {
        appendMessage('bot', data.reply, data.provider);
        chatHistory = data.history;
      }
    } catch {
      removeTyping();
      showToast('Cannot reach server on port 3000');
      appendMessage('bot', 'Connection failed. Is the Vocus middleware server running?');
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('input').focus();
    }
  }

  // init
  renderQuick();
</script>
</body>
</html>
