<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 40px 24px;
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 16px;
      color: #64748b;
      max-width: 420px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Welcome to My Website</h1>
    <p>This is a simple page with the chatbot widget embedded. Click the button in the bottom-right corner to chat.</p>
    <span class="badge">💬 Chat widget active</span>
  </div>

  <!-- Chatbot widget — works on any website -->
<script>
  window.ChatWidgetConfig = {
    serverUrl: 'http://localhost:3000',
    app: 'vocuscustomer',
    title: 'Customer Support',
    theme: '#2563eb',
  };
</script>
<script src="http://localhost:3000/widget.js"></script>
</body>
</html>
